    WorkflowNode:
      type: object
      description: Um passo do workflow.
      required:
      - id
      - type
      properties:
        id:
          type: string
          description: Identificador do passo dentro do workflow. Você escolhe; precisa ser único.
          example: n1
        type:
          type: string
          enum:
          - manual_trigger
          - segment_trigger
          - form_trigger
          - crm_event_trigger
          - send_email
          - wait
          - wait_reaction
          - if_else
          - split
          - create_task
          - create_deal
          - update_contact
          - end
          description: Tipo do passo. A configuração de cada tipo está descrita em "Workflows", na introdução.
        config:
          type: object
          description: Configuração do passo, conforme o `type`.
        label:
          type: string
          description: Nome mostrado no desenho.
        disabled:
          type: boolean
          description: Passo desligado.
        position:
          type: object
          description: Posição no desenho da tela.
          properties:
            x:
              type: number
            y:
              type: number
    WorkflowEdge:
      type: object
      description: Ligação entre dois passos.
      required:
      - id
      - from
      - port
      - to
      properties:
        id:
          type: string
          description: Identificador da ligação.
          example: e1
        from:
          type: string
          description: '`id` do passo de origem.'
          example: n1
        port:
          type: string
          description: 'Saída do passo de origem: `default` na maioria; `yes` ou `no` em `if_else`; o `id` do caminho ou `none` em `split`; o
            `id` da reação ou `timeout` em `wait_reaction`.'
          example: default
        to:
          type: string
          description: '`id` do passo de destino.'
          example: n2
    WorkflowGraph:
      type: object
