      summary: Criar automação
      description: 'O único campo obrigatório é `title`.


        **Atenção:** sem `status`, a automação nasce `WAITING`, ou seja, ativa: uma automação por filtro executa no próximo horário agendado,
        e uma por evento, no próximo evento. Para criar pausada, envie `status: FREEZE`, confira o alcance com `POST /api/processautomations/{id}/simulate`
