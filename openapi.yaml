              - type: object
                required:
                - title
                - displayAs
                - content
                - sizeX
                - sizeY
                - row
                - col
            example:
              title: Valor por etapa
              displayAs: CHART/BAR
              sizeX: 4
              sizeY: 2
              row: 0
              col: 0
              content:
                datasource: deal
                filter:
                  ruleset:
                    condition: AND
                    rules:
                    - fieldId: deal.amount
                      operator: greater
                      value: 1000
                    - condition: OR
                      rules:
                      - fieldId: deal.won
                        operator: false_value
                      - fieldId: deal.stage_name
                        operator: contains
                        value: Proposta
                axisX:
                  resourceKeywordSlug: deal.stage_name
                  aggregation: GROUP
                axisY:
                  resourceKeywordSlug: deal.amount
                  aggregation: SUM
