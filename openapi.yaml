          - string
          - number
          - monetary
          - boolean
          - date
          - days
          - select
          - month_select
          - date_select
          description: 'Tipo do campo: define quais operadores fazem sentido.'
        fieldRef:
          type: string
          description: Caminho interno do campo.
          example: dealObj.amount
        settings:
          type: object
          properties:
