                    pipelineId:
                      type: string
                      pattern: ^[a-fA-F0-9]{24}$
                      example: 507f1f77bcf86cd799439011
                    stageId:
                      type: string
                      pattern: ^[a-fA-F0-9]{24}$
                      example: 507f1f77bcf86cd799439011
                    formId:
                      type: string
                      pattern: ^[a-fA-F0-9]{24}$
                      example: 507f1f77bcf86cd799439011
