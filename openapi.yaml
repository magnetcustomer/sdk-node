openapi: 3.0.3
info:
  title: API da Magnet Customer
  version: 2026-11
  description: "A API REST da Magnet Customer permite ler e gravar os registros do CRM a partir dos seus sistemas.\n\n# Comece aqui\n\n## 1. Crie\
    \ um Service Account\n\nNo CRM, abra **Configurações › Service Accounts** (apenas administradores), clique em **Novo service account**, escolha\
    \ a validade e as permissões, e copie o **Client ID** e o **Client Secret**. O secret aparece uma única vez.\n\n## 2. Solicite um token\n\n\
    ```bash\ncurl -X POST https://magnetcustomer.net/realms/platform/protocol/openid-connect/token \\\n  -H \"Content-Type: application/x-www-form-urlencoded\"\
    \ \\\n  -d \"grant_type=client_credentials\" \\\n  -d \"client_id=SEU_CLIENT_ID\" \\\n  -d \"client_secret=SEU_CLIENT_SECRET\"\n```\n\n```json\n\
    { \"access_token\": \"eyJhbGciOiJSUzI1NiIs...\", \"expires_in\": 900, \"token_type\": \"Bearer\" }\n```\n\nO token vale 15 minutos e este\
    \ fluxo não tem refresh token: quando vencer, ou ao receber `401`, repita o pedido.\n\n## 3. Chame a API\n\nCada conta tem o seu endereço.\
    \ Troque `sua-conta` pelo subdomínio que você usa para abrir o CRM:\n\n```bash\ncurl \"https://sua-conta.platform-api.magnetcustomer.com/api/deals?page=1&limit=15\"\
    \ \\\n  -H \"Authorization: Bearer SEU_TOKEN\"\n```\n\nRequisições com corpo levam também `Content-Type: application/json`.\n\n# Convenções\n\
    \n## Paginação\n\nEnvie sempre `page`. Com ele, toda listagem devolve o mesmo envelope:\n\n```json\n{ \"docs\": [], \"total\": 132, \"pages\"\
    : 9, \"page\": 1, \"limit\": 15 }\n```\n\n| Parâmetro | Padrão | Descrição |\n|---|---|---|\n| `page` | — | Página, a partir de 1. **Obrigatório\
    \ na prática** |\n| `limit` | 15 | Registros por página. Máximo 100: acima disso a API usa 100 |\n| `sortBy` | varia por recurso | Campo de\
    \ ordenação |\n| `sortType` | `desc` | `asc` ou `desc` |\n| `search` | — | Busca textual, quando o recurso aceita |\n\nSem `page`, a maioria\
    \ das listagens devolve uma lista simples (`[...]`), sem o envelope, e ignora `limit`. Para percorrer tudo, peça `page=1` e avance até `page`\
    \ ser igual a `pages`. Uma página além do fim devolve `docs` vazio.\n\nO tamanho de página padrão é 15, com duas exceções: 25 em Leads, Prospects\
    \ e Clientes, e 100 em Usuários. Um `limit` inválido cai no padrão.\n\n## Identificadores e datas\n\nTodo ID é um texto de 24 caracteres hexadecimais,\
    \ como `507f1f77bcf86cd799439011`. Ao gravar, envie a referência como **ID em texto** — nunca o objeto.\n\nUm ID fora desse formato hoje é\
    \ respondido com `500`, não `400`: valide o formato antes de enviar.\n\nNo corpo e nas respostas, datas são ISO 8601 em UTC, como `2026-05-15T10:00:00Z`.\
    \ Nos filtros de data da URL (`minDate`, `dateOfExpires_minDate`...), o valor é um **timestamp em milissegundos**, como `1798761600000`; uma\
    \ data ISO ali não filtra o que você espera.\n\n## Campos ausentes\n\nCampo sem valor costuma vir **ausente** da resposta, não como `null`.\
    \ Trate a falta da chave como vazio.\n\n## Campos personalizados\n\nOs campos criados pelo administrador da conta vão na lista `customFields`:\n\
    \n```json\n{ \"customFields\": [ { \"customField\": \"507f1f77bcf86cd799439014\", \"k\": \"segmento\", \"v\": \"Tecnologia\" } ] }\n```\n\n\
    O valor vai em **`v`**. Um item com `value` é aceito sem erro, mas o campo fica vazio. Descubra os campos e os IDs com `GET /api/customfields?page=1&feature=deal`\
    \ (troque `deal` por `meeting`, `task`, `contact`...). Com `&required=true` vêm só os obrigatórios da conta.\n\n## Erros\n\n```json\n{\n \
    \ \"reason\": \"Missing required parameters\",\n  \"message\": \"Missing required parameters\",\n  \"code\": \"VALIDATION_ERROR\",\n  \"errors\"\
    : [ { \"field\": \"title\", \"message\": \"must NOT have fewer than 1 characters\", \"keyword\": \"minLength\" } ]\n}\n```\n\n| Status | Quando\
    \ |\n|---|---|\n| `400` | Corpo inválido: campo obrigatório ausente, tipo errado, valor fora da lista |\n| `401` | Token ausente, inválido\
    \ ou vencido. Corpo: `{\"reason\": \"Access Denied\"}` |\n| `403` | O Service Account não tem a permissão da rota (`type: SA_PERMISSION_DENIED`,\
    \ com `requiredPermission`) ou a rota exige administrador (`type: ADMIN_REQUIRED`) |\n| `404` | Registro não encontrado |\n| `409` | O registro\
    \ não está no estado que a operação exige |\n| `429` | Limite de requisições excedido. Espere o tempo de `Retry-After` |\n\n## Limite de requisições\n\
    \nOs limites são aplicados por conta. Ao receber `429`, espere os segundos indicados em `Retry-After` e tente de novo com intervalo crescente.\n\
    \n## Área de trabalho\n\nEm contas com áreas de trabalho, a API define a área do registro pela credencial ou pelo registro pai. Não envie\
    \ `workspace`.\n\n# Cobertura\n\nEsta referência cobre Contatos (leads, prospects e clientes), Empresas, Oportunidades, Pipelines e etapas,\
    \ Reuniões, Tarefas, Observações, Usuários e Campos personalizados. Tickets, Atendimentos e Webhooks entram nas próximas revisões.\n"
  contact:
    name: Suporte Magnet Customer
    email: suporte@magnetcustomer.com
servers:
- url: https://{conta}.platform-api.magnetcustomer.com
  description: API da sua conta
  variables:
    conta:
      default: sua-conta
      description: Subdomínio da sua conta — o mesmo que você usa para abrir o CRM.
security:
- ServiceAccount: []
tags:
- name: Contatos
  description: 'Pessoas em qualquer fase: lead, prospect ou cliente.'
- name: Leads
  description: Contatos na fase `lead`. Mesmos campos de Contatos.
- name: Prospects
  description: Contatos na fase `prospect`. Mesmos campos de Contatos.
- name: Clientes
  description: Contatos na fase `customer`. Mesmos campos de Contatos.
- name: Empresas
  description: Organizações às quais os contatos pertencem.
- name: Oportunidades
  description: 'Negócios em andamento: pipeline, etapa, responsável, valor e fechamento.'
- name: Pipelines e etapas
  description: Consulta dos pipelines e das etapas, para criar e mover oportunidades.
- name: Reuniões
  description: Compromissos com contato, empresa ou oportunidade.
- name: Tarefas
  description: Atividades com responsável, tipo e vencimento.
- name: Tipos de tarefa
  description: Cadastro dos tipos usados no campo `type` das tarefas.
- name: Observações
  description: Anotações em contatos, empresas, oportunidades e produtos, com menção a usuários.
- name: Usuários
  description: Consulta dos usuários da conta, para preencher responsáveis e participantes.
- name: Campos personalizados
  description: 'Consulta dos campos da conta: IDs, chaves e quais são obrigatórios.'
x-tagGroups:
- name: Cadastros
  tags:
  - Contatos
  - Leads
  - Prospects
  - Clientes
  - Empresas
- name: Vendas
  tags:
  - Oportunidades
  - Pipelines e etapas
- name: Atividades
  tags:
  - Reuniões
  - Tarefas
  - Tipos de tarefa
  - Observações
- name: Configuração da conta
  tags:
  - Usuários
  - Campos personalizados
paths:
  /api/deals:
    get:
      tags:
      - Oportunidades
      operationId: listDeals
      summary: Listar oportunidades
      description: 'Ordenação padrão: `createdAt` decrescente.'
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/SortBy'
      - $ref: '#/components/parameters/SortType'
      - name: pipeline
        in: query
        description: ID do pipeline.
        schema:
          type: string
      - name: stage
        in: query
        description: ID da etapa.
        schema:
          type: string
      - name: contact
        in: query
        description: ID do contato.
        schema:
          type: string
      - name: organization
        in: query
        description: ID da empresa.
        schema:
          type: string
      - name: staffs
        in: query
        description: 'Usuários: busca em responsável, participantes e observadores. Repita o parâmetro para enviar vários (`?staffs=id1&staffs=id2`).'
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
      - name: contacts
        in: query
        description: Vários contatos. Repita o parâmetro para enviar vários (`?contacts=id1&contacts=id2`).
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
      - name: minDate
        in: query
        description: Fechamento previsto (`expectedCloseDate`) a partir de. Timestamp em milissegundos, não data ISO.
        schema:
          type: integer
          example: 1798761600000
      - name: maxDate
        in: query
        description: Fechamento previsto até. Timestamp em milissegundos.
        schema:
          type: integer
      - name: search
        in: query
        description: Busca em título, nome e e-mail do contato.
        schema:
          type: string
      responses:
        '200':
          description: Sucesso.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Page'
                - type: object
                  properties:
                    docs:
                      type: array
                      items:
                        $ref: '#/components/schemas/Deal'
              example:
                docs:
                - _id: 507f1f77bcf86cd799439015
                  code: 39
                  title: Implantação CRM Enterprise
                  amount: 75000
                  expectedCloseDate: '2026-06-30T23:59:59Z'
                  won: false
                  lost: false
                  closed: false
                  closedDate: null
                  enteredStageDate: '2026-04-28T10:30:00Z'
                  source: platform
                  active: true
                  pipeline: 507f1f77bcf86cd799439011
                  stage:
                    _id: 507f191e810c19729de860ea
                    name: Prospecção
                    position: 0
                    won: false
                    lost: false
                  staff:
                    _id: 507f191e810c19729de860eb
                    fullname: João Silva
                    email: joao@acme.com
                  contact:
                    _id: 507f1f77bcf86cd799439012
                    fullname: Maria Santos
                    lifeCycle: customer
                    owners:
                    - 507f191e810c19729de860eb
                  participants: []
                  observers: []
                  labels: []
                  customFields:
                  - customField: 507f1f77bcf86cd799439014
                    k: segmento
                    v: Tecnologia
                  createdAt: '2026-04-28T10:30:00Z'
                  updatedAt: '2026-04-28T10:30:00Z'
                total: 132
                pages: 9
                page: 1
                limit: 15
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags:
      - Oportunidades
      operationId: createDeal
      summary: Criar oportunidade
      description: 'Se `staff` não for enviado, a API usa o usuário da credencial.


        A criação é idempotente por 5 minutos: reenviar o mesmo corpo não duplica o registro. Para controlar a chave, envie o cabeçalho `Idempotency-Key`.'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DealCreate'
            example:
              title: Implantação CRM Enterprise
              pipeline: 507f1f77bcf86cd799439011
              stage: 507f191e810c19729de860ea
              staff: 507f191e810c19729de860eb
              amount: 75000
              contact: 507f1f77bcf86cd799439012
              expectedCloseDate: '2026-06-30T23:59:59Z'
              customFields:
              - customField: 507f1f77bcf86cd799439014
                k: segmento
                v: Tecnologia
      responses:
        '201':
          description: Oportunidade criada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deal'
              example:
                _id: 507f1f77bcf86cd799439015
                code: 39
                title: Implantação CRM Enterprise
                amount: 75000
                expectedCloseDate: '2026-06-30T23:59:59Z'
                won: false
                lost: false
                closed: false
                closedDate: null
                enteredStageDate: '2026-04-28T10:30:00Z'
                source: platform
                active: true
                pipeline: 507f1f77bcf86cd799439011
                stage:
                  _id: 507f191e810c19729de860ea
                  name: Prospecção
                  position: 0
                  won: false
                  lost: false
                staff:
                  _id: 507f191e810c19729de860eb
                  fullname: João Silva
                  email: joao@acme.com
                contact:
                  _id: 507f1f77bcf86cd799439012
                  fullname: Maria Santos
                  lifeCycle: customer
                  owners:
                  - 507f191e810c19729de860eb
                participants: []
                observers: []
                labels: []
                customFields:
                - customField: 507f1f77bcf86cd799439014
                  k: segmento
                  v: Tecnologia
                createdAt: '2026-04-28T10:30:00Z'
                updatedAt: '2026-04-28T10:30:00Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/deals/{id}:
    get:
      tags:
      - Oportunidades
      operationId: getDeal
      summary: Obter oportunidade
      description: No detalhe, `pipeline` vem como objeto (`_id`, `title`) e `contact` vem com o cadastro completo.
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deal'
              example:
                _id: 507f1f77bcf86cd799439015
                code: 39
                title: Implantação CRM Enterprise
                amount: 75000
                expectedCloseDate: '2026-06-30T23:59:59Z'
                won: false
                lost: false
                closed: false
                closedDate: null
                enteredStageDate: '2026-04-28T10:30:00Z'
                source: platform
                active: true
                pipeline:
                  _id: 507f1f77bcf86cd799439011
                  title: Comercial
                stage:
                  _id: 507f191e810c19729de860ea
                  name: Prospecção
                staff:
                  _id: 507f191e810c19729de860eb
                  fullname: João Silva
                  email: joao@acme.com
                contact:
                  _id: 507f1f77bcf86cd799439012
                  fullname: Maria Santos
                  lifeCycle: customer
                  owners:
                  - 507f191e810c19729de860eb
                participants: []
                observers: []
                labels: []
                customFields:
                - customField: 507f1f77bcf86cd799439014
                  k: segmento
                  v: Tecnologia
                createdAt: '2026-04-28T10:30:00Z'
                updatedAt: '2026-04-28T10:30:00Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
      - Oportunidades
      operationId: updateDeal
      summary: Atualizar oportunidade
      description: Envie só os campos que mudam.
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DealInput'
            example:
              amount: 90000
      responses:
        '200':
          description: Sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deal'
              example:
                _id: 507f1f77bcf86cd799439015
                code: 39
                title: Implantação CRM Enterprise
                amount: 90000
                expectedCloseDate: '2026-06-30T23:59:59Z'
                won: false
                lost: false
                closed: false
                closedDate: null
                enteredStageDate: '2026-04-28T10:30:00Z'
                source: platform
                active: true
                pipeline: 507f1f77bcf86cd799439011
                stage:
                  _id: 507f191e810c19729de860ea
                  name: Prospecção
                  position: 0
                  won: false
                  lost: false
                staff:
                  _id: 507f191e810c19729de860eb
                  fullname: João Silva
                  email: joao@acme.com
                contact:
                  _id: 507f1f77bcf86cd799439012
                  fullname: Maria Santos
                  lifeCycle: customer
                  owners:
                  - 507f191e810c19729de860eb
                participants: []
                observers: []
                labels: []
                customFields:
                - customField: 507f1f77bcf86cd799439014
                  k: segmento
                  v: Tecnologia
                createdAt: '2026-04-28T10:30:00Z'
                updatedAt: '2026-04-28T10:30:00Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - Oportunidades
      operationId: deleteDeal
      summary: Excluir oportunidade
      description: 'Exclusão lógica (`active: false`). Responde `400` com `code: DEAL_HAS_LINKED_JOURNEYS` se houver jornadas ativas vinculadas.'
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Oportunidade excluída.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deal'
              example:
                _id: 507f1f77bcf86cd799439015
                code: 39
                title: Implantação CRM Enterprise
                amount: 75000
                expectedCloseDate: '2026-06-30T23:59:59Z'
                won: false
                lost: false
                closed: false
                closedDate: null
                enteredStageDate: '2026-04-28T10:30:00Z'
                source: platform
                active: false
                pipeline: 507f1f77bcf86cd799439011
                stage:
                  _id: 507f191e810c19729de860ea
                  name: Prospecção
                  position: 0
                  won: false
                  lost: false
                staff:
                  _id: 507f191e810c19729de860eb
                  fullname: João Silva
                  email: joao@acme.com
                contact:
                  _id: 507f1f77bcf86cd799439012
                  fullname: Maria Santos
                  lifeCycle: customer
                  owners:
                  - 507f191e810c19729de860eb
                participants: []
                observers: []
                labels: []
                customFields:
                - customField: 507f1f77bcf86cd799439014
                  k: segmento
                  v: Tecnologia
                createdAt: '2026-04-28T10:30:00Z'
                updatedAt: '2026-04-28T10:30:00Z'
        '204':
          description: A oportunidade não existe ou já estava excluída.
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/deals/{id}/stage:
    patch:
      tags:
      - Oportunidades
      operationId: moveDealStage
      summary: Mover de etapa
      description: A resposta vem em um envelope com `deal` e `oldStageId`, não a oportunidade direta.
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - stageId
              properties:
                stageId:
                  type: string
                  pattern: ^[a-fA-F0-9]{24}$
                  example: 507f1f77bcf86cd799439011
                  description: ID da nova etapa.
                enteredStageDate:
                  type: string
                  format: date-time
                  description: 'Quando entrou na etapa. Padrão: agora.'
                  example: '2026-05-15T14:00:00Z'
            example:
              stageId: 507f191e810c19729de860ef
      responses:
        '200':
          description: Sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deal:
                    $ref: '#/components/schemas/Deal'
                  oldStageId:
                    type: string
                    pattern: ^[a-fA-F0-9]{24}$
                    example: 507f1f77bcf86cd799439011
                    description: Etapa anterior.
              example:
                deal:
                  _id: 507f1f77bcf86cd799439015
                  stage: 507f191e810c19729de860ef
                oldStageId: 507f191e810c19729de860ea
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/deals/{id}/close:
    put:
      tags:
      - Oportunidades
      operationId: closeDeal
      summary: Fechar como ganha ou perdida
      description: 'Envie `won: true` para ganha, ou `lost: true` com `lostReason` para perdida.'
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                won:
                  type: boolean
                  description: Marca como ganha.
                lost:
                  type: boolean
                  description: Marca como perdida.
                lostReason:
                  type: string
                  pattern: ^[a-fA-F0-9]{24}$
                  example: 507f1f77bcf86cd799439011
                  description: Motivo da perda, configurado no pipeline.
            example:
              lost: true
              lostReason: 507f1f77bcf86cd799439016
      responses:
        '200':
          description: Sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deal'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/deals/{id}/reopen:
    put:
      tags:
      - Oportunidades
      operationId: reopenDeal
      summary: Reabrir oportunidade
      description: Reabre uma oportunidade ganha ou perdida. Responde `409` se ela não estiver fechada.
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                pipeline:
                  type: string
                  pattern: ^[a-fA-F0-9]{24}$
                  example: 507f1f77bcf86cd799439011
                  description: 'Opcional: move para outro pipeline ao reabrir.'
      responses:
        '200':
          description: Sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deal'
        '400':
