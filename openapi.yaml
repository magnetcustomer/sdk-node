    get:
      tags:
      - Oportunidades
      operationId: validateDeal
      summary: Validar pendências antes de fechar
      description: Diz se a oportunidade tem ações ou campos obrigatórios pendentes. Cada lista traz o que falta; vazia quando não falta nada.
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  validation:
                    type: boolean
                    description: '`true` quando não há pendência.'
                  requiredActionsPending:
                    type: object
                    properties:
                      validation:
                        type: boolean
                      task:
                        type: array
                        items:
                          type: object
                        description: Tarefas exigidas pela etapa.
                      meeting:
                        type: array
                        items:
                          type: object
                        description: Reuniões exigidas pela etapa.
                      ticket:
                        type: array
                        items:
                          type: object
                        description: Tickets exigidos pela etapa.
                  requiredFieldPending:
                    type: object
                    properties:
                      validation:
                        type: boolean
                      contact:
                        type: array
                        items:
                          type: object
                        description: Campos do contato que faltam.
                      deal:
                        type: array
                        items:
                          type: object
                        description: Campos da oportunidade que faltam.
              example:
                requiredActionsPending:
                  task: []
                  meeting: []
                  ticket: []
                  validation: true
                requiredFieldPending:
                  contact: []
                  deal: []
                  validation: true
                validation: true
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
