    Rule:
      type: object
      description: Uma condição sobre um campo. Um grupo aninhado usa `condition` e `rules` no lugar de `fieldId` e `operator`.
      properties:
        fieldId:
          type: string
          description: 'Campo testado: o `slug` de um campo de `GET /api/resource-keywords`.'
          example: deal.amount
        resourceKeywordId:
          type: string
          pattern: ^[a-fA-F0-9]{24}$
          example: 507f1f77bcf86cd799439011
          description: ID do mesmo campo (`_id` em `GET /api/resource-keywords`). Opcional; envie quando a conta tiver campos personalizados de
            nome parecido, para não haver ambiguidade.
        operator:
          type: string
          enum:
          - equals
          - not_equal
          - less
          - less_or_equals
          - greater
          - greater_or_equals
          - between
          - contains
          - not_contains
          - starts_with
          - ends_with
          - regex
          - exists
          - not_exists
          - true_value
          - false_value
          - in
          - not_in
          - contains_all
          - current_day
          - current_week
          - current_month
          - current_year
          - before_day
          - before_week
          - before_month
          - before_year
          - last_n_days
          - next_n_days
          - next_n_business_days
          - next_month
          - older_than_days
          - older_than_hours
          - newer_than_days
          - before_date
          - after_date
          - date_between
          - month_equals
          description: Operador. Os de data relativa (`current_month`, `last_n_days`...) e os de existência (`exists`, `true_value`...) não usam
            `value`, ou usam `value` como o número de dias.
        value:
          description: 'Valor comparado: texto, número, booleano ou lista (em `in`, `not_in`, `contains_all`).'
        valueMin:
          description: Limite inferior, em `between` e `date_between`.
        valueMax:
          description: Limite superior, em `between` e `date_between`.
        condition:
          type: string
          enum:
          - AND
          - OR
          description: 'Só em grupo aninhado: como combinar as `rules` do grupo.'
        rules:
          type: array
          items:
            type: object
          description: 'Só em grupo aninhado: as condições do grupo, no mesmo formato.'
    Ruleset:
      type: object
      description: Conjunto de regras de filtro. É o mesmo formato em dashboards, widgets e predefinições de filtro.
      required:
      - condition
      - rules
      properties:
        condition:
          type: string
          enum:
          - AND
          - OR
          description: '`AND`: todas as regras precisam valer. `OR`: basta uma.'
        rules:
          type: array
          items:
            $ref: '#/components/schemas/Rule'
          description: Condições e grupos aninhados. Lista vazia não filtra nada.
    ResourceKeyword:
      type: object
