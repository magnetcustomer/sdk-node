  /api/processautomations/{id}/status:
    put:
      tags:
      - Automações
      operationId: updateAutomationStatus
      summary: Ativar, pausar ou concluir automação
      description: 'Transições aceitas: de `WAITING` para `FREEZE`, `FINISHED` ou `RECURRENCE`; de `FREEZE` para `WAITING` ou `RECURRENCE`; de
        `RECURRENCE` para `FREEZE`, `WAITING` ou `FINISHED`; de `FINISHED` para `WAITING` ou `RECURRENCE`. Fora disso a resposta é `400` com `allowedTransitions`.'
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - status
              properties:
                status:
                  type: string
                  enum:
                  - WAITING
                  - FREEZE
                  - RECURRENCE
                  - FINISHED
                  description: '`WAITING`: ativa, aguardando a próxima execução. `FREEZE`: pausada. `RECURRENCE`: ativa e recorrente. `FINISHED`:
                    concluída.'
            example:
              status: FREEZE
      responses:
        '200':
          description: Sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  processAutomation:
                    type: object
                    properties:
                      _id:
                        type: string
                        pattern: ^[a-fA-F0-9]{24}$
                        example: 507f1f77bcf86cd799439011
                      title:
                        type: string
                      status:
                        type: string
                        enum:
                        - WAITING
                        - FREEZE
                        - RECURRENCE
                        - FINISHED
                        description: '`WAITING`: ativa, aguardando a próxima execução. `FREEZE`: pausada. `RECURRENCE`: ativa e recorrente. `FINISHED`:
                          concluída.'
                      previousStatus:
                        type: string
                        enum:
                        - WAITING
                        - FREEZE
                        - RECURRENCE
                        - FINISHED
                        description: '`WAITING`: ativa, aguardando a próxima execução. `FREEZE`: pausada. `RECURRENCE`: ativa e recorrente. `FINISHED`:
                          concluída.'
                      updatedAt:
                        type: string
                        format: date-time
                        description: Alteração.
                        example: '2026-05-15T14:00:00Z'
              example:
                success: true
                message: Status da automação alterado para FREEZE
                processAutomation:
                  _id: 507f1f77bcf86cd799439200
                  title: Alerta de contato sem interação
                  status: FREEZE
                  previousStatus: WAITING
                  updatedAt: '2026-04-28T10:35:00Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '404':
          $ref: '#/components/responses/NotFound'
