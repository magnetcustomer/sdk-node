  /api/dashboards/{dashboard}/widgets/{widget}/content:
    get:
      tags:
      - Dashboards
      operationId: getWidgetContent
      summary: Obter o resultado do widget
      description: 'O formato depende de `displayAs`:


        - `NUMBER`: `{ "value": 12 }`.

        - `PERCENTAGE`: `{ "value": 3, "total": 1, "percentage": 300 }`, em que `percentage` é `value ÷ total × 100`.

        - Gráficos: `{ "labels": [...], "data": [...] }`, um valor por rótulo.

        - Gráficos com `seriesBy`: `{ "series": [...], "labels": [...], "data": [[{ "x": rótulo, "y": valor }]] }`, uma lista por série.'
      parameters:
      - name: dashboard
        in: path
        required: true
        description: ID do dashboard.
        schema:
          type: string
          pattern: ^[a-fA-F0-9]{24}$
          example: 507f1f77bcf86cd799439011
      - name: widget
        in: path
        required: true
        description: ID do widget.
        schema:
          type: string
          pattern: ^[a-fA-F0-9]{24}$
          example: 507f1f77bcf86cd799439011
      responses:
        '200':
          description: Sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  value:
                    type: number
                    description: Em `NUMBER` e `PERCENTAGE`.
                  total:
                    type: number
                    description: Em `PERCENTAGE`.
                  percentage:
                    type: number
                    description: Em `PERCENTAGE`.
                  labels:
                    type: array
                    items:
                      type: string
                    description: Rótulos do eixo X, em gráficos.
                  data:
                    type: array
                    items: {}
                    description: Valores, em gráficos.
                  series:
                    type: array
                    items:
                      type: string
                    description: Nomes das séries, com `seriesBy`.
              example:
                labels:
                - Prospecção
                - Proposta
                - Fechamento
                data:
                - 150000
                - 90000
                - 42000
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '404':
          $ref: '#/components/responses/NotFound'
