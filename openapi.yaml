        As regras de `content.filter.ruleset` não são validadas na gravação: um operador ou campo inexistente é aceito e o widget passa a devolver
        resultado vazio. Confira os nomes em `GET /api/resource-keywords`.


        **Permissão do Service Account:** `dashboards.create-widget`'
      parameters:
      - name: dashboard
        in: path
        required: true
        description: ID do dashboard.
