                            type: array
                            items:
                              type: string
                          description:
                            type: string
                      actions:
                        type: array
                        items:
                          type: object
                        description: O que cada ação faria.
                      warnings:
                        type: array
                        items:
                          type: string
                        description: Avisos, como filtro que não casa com nada.
                      simulatedAt:
                        type: string
                        format: date-time
                        description: Quando foi simulada.
                        example: '2026-05-15T14:00:00Z'
              example:
                simulation:
                  status: complete
                  totalMatched: 12
                  truncated: false
                  noFilter: false
                  filter:
                    conditionsCount: 1
                    lifeCycles: []
                    description: ''
                  actions: []
