      description: 'Posições do contato, já prontas para exibir: nome e código do ativo, rótulos da classe e da origem, e valores principais.
        `summary` traz o patrimônio total e a composição por classe, calculados sobre todas as posições do contato, não só as da página. Tamanho
        de página padrão: 15.'
      parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Limit'
      - name: sort
        in: query
        description: '`value` ordena pelo valor da posição, do maior para o menor. Sem o parâmetro: `createdAt` decrescente.'
        schema:
          type: string
          enum:
          - value
      responses:
        '200':
          description: Sucesso.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Page'
                - type: object
                  properties:
                    docs:
                      type: array
                      items:
                        type: object
                        properties:
                          _id:
                            type: string
                            pattern: ^[a-fA-F0-9]{24}$
                            example: 507f1f77bcf86cd799439011
                          type:
                            type: string
                            enum:
                            - financialProductEquities
                            - financialProductFixedIncome
                            - financialProductInvestmentFund
                            - financialProductPension
                            - financialProductFixedIncomeStructuredNote
                            - financialProductCryptoCoins
                            - financialProductPendingSettlements
                          typeLabel:
                            type: string
                            description: Classe, por extenso.
                          source:
                            type: string
                          sourceLabel:
                            type: string
                            description: Origem, por extenso.
                          displayName:
                            type: string
                            description: Nome do ativo.
                          displayTicker:
                            type: string
                            description: Código do ativo.
                          positionDate:
                            type: string
                            format: date-time
                            description: Data da posição.
                            example: '2026-05-15T14:00:00Z'
                          endPositionValue:
                            type: number
                            description: Valor da posição.
                          grossValue:
                            type: number
                            description: Valor bruto.
                          netValue:
                            type: number
                            description: Valor líquido.
                          quantity:
                            type: number
                            description: Quantidade.
                          accountNumber:
                            type: string
                          marketName:
                            type: string
                    summary:
                      type: object
                      properties:
                        totalPatrimonio:
                          type: number
                          description: Soma das posições do contato.
                        positionDate:
                          type: string
                          format: date-time
                          description: Data da posição mais recente.
                          example: '2026-05-15T14:00:00Z'
                        totalProducts:
                          type: integer
                        byType:
                          type: array
                          items:
                            type: object
                            properties:
                              type:
                                type: string
                              total:
                                type: number
                              count:
                                type: integer
                          description: Composição por classe.
              example:
                docs:
                - _id: 507f1f77bcf86cd799439270
                  type: financialProductEquities
                  typeLabel: Ações / FIIs
                  source: manual
                  sourceLabel: Manual
                  displayName: PETR4
                  displayTicker: PETR4
                  positionDate: '2026-05-10T00:00:00Z'
                  endPositionValue: 15230.5
                  grossValue: 15230.5
                  quantity: 400
                  accountNumber: '000123'
                  marketName: Renda Variável
                total: 1
                pages: 1
                page: 1
