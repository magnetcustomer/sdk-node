        '429':
          $ref: '#/components/responses/TooManyRequests'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - Itens de produto
      operationId: removeProductItem
      summary: Remover item
      parameters:
      - name: itemId
        in: path
        required: true
        description: ID do item (`_id` devolvido ao vincular).
        schema:
          type: string
          pattern: ^[a-fA-F0-9]{24}$
          example: 507f1f77bcf86cd799439011
      responses:
        '200':
          description: Item removido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductItem'
              example:
                _id: 507f1f77bcf86cd799439170
                product: 507f1f77bcf86cd799439150
                pricebookEntry: 507f1f77bcf86cd799439160
                category: CATALOG
                quantity: 2
                unitPrice: 1200
                discount: 100
                totalPrice: 2300
                deal: 507f1f77bcf86cd799439015
                active: false
                createdAt: '2026-04-28T10:30:00Z'
                updatedAt: '2026-04-28T10:30:00Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '404':
          $ref: '#/components/responses/NotFound'
      description: '**Permissão do Service Account:** `products.delete`'
components:
  securitySchemes:
    ServiceAccount:
      type: oauth2
      description: Token obtido com o Client ID e o Client Secret de um Service Account (Configurações › Service Accounts).
      flows:
        clientCredentials:
          tokenUrl: https://magnetcustomer.net/realms/platform/protocol/openid-connect/token
          scopes: {}
  parameters:
    Id:
      name: id
      in: path
      required: true
      description: ID do registro.
      schema:
        type: string
        pattern: ^[a-fA-F0-9]{24}$
        example: 507f1f77bcf86cd799439011
    Page:
      name: page
      in: query
      description: 'Página, a partir de 1. **Envie sempre**: sem `page`, a resposta vem como lista simples, sem o envelope de paginação, e `limit`
        é ignorado.'
      schema:
        type: integer
        default: 1
        minimum: 1
        example: 1
    Limit:
      name: limit
      in: query
      description: 'Registros por página. Padrão: 15, salvo indicação na operação. Máximo: 100 — acima disso a API usa 100.'
      schema:
        type: integer
        default: 15
        minimum: 1
        maximum: 100
    SortBy:
      name: sortBy
      in: query
      description: Campo de ordenação. O padrão varia por recurso.
      schema:
        type: string
    SortType:
      name: sortType
      in: query
      description: Direção da ordenação.
      schema:
        type: string
        enum:
        - asc
        - desc
        default: desc
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Chave única da operação (UUID). Repita a mesma chave nas novas tentativas.
      schema:
        type: string
        format: uuid
  responses:
    ValidationError:
      description: Corpo ou parâmetros inválidos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            reason: Missing required parameters
            message: Missing required parameters
            code: VALIDATION_ERROR
            errors:
            - field: title
              message: must NOT have fewer than 1 characters
              keyword: minLength
    Unauthorized:
      description: Token ausente, inválido ou vencido. Solicite um novo token.
      content:
        application/json:
          schema:
            type: object
            properties:
              reason:
                type: string
          example:
            reason: Access Denied
    Forbidden:
      description: O Service Account não tem a permissão que a rota exige.
      content:
        application/json:
          schema:
            type: object
            properties:
              reason:
                type: string
              type:
                type: string
                description: '`SA_PERMISSION_DENIED` quando falta uma permissão; `ADMIN_REQUIRED` quando a rota exige administrador.'
              requiredPermission:
                type: string
                description: 'Permissão que falta: ligue-a no Service Account.'
          example:
            reason: Service account sem permissão para este recurso.
            type: SA_PERMISSION_DENIED
            requiredPermission: deals.delete
    NotFound:
      description: Registro não encontrado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            reason: Contact not found
            message: Contact not found
            code: NOT_FOUND
    Conflict:
      description: O registro não está no estado que a operação exige.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Limite de requisições excedido. Espere o tempo do cabeçalho `Retry-After`.
      headers:
        Retry-After:
          description: Segundos até poder tentar de novo.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Page:
      type: object
      description: Envelope de toda listagem paginada.
      required:
      - docs
      - total
      - pages
      - page
      - limit
      properties:
        docs:
          type: array
          items: {}
          description: Registros da página.
        total:
          type: integer
          description: Total de registros que casam com a consulta.
          example: 132
        pages:
          type: integer
          description: Total de páginas.
          example: 9
        page:
          type: integer
          description: Página atual.
          example: 1
        limit:
          type: integer
          description: Registros por página aplicados (no máximo 100).
          example: 15
    Error:
      type: object
      description: Formato de erro da API.
      properties:
        reason:
          type: string
          description: Mensagem do erro.
        message:
          type: string
          description: Igual a `reason`.
        code:
          type: string
          description: Código do erro.
          enum:
          - BAD_REQUEST
          - VALIDATION_ERROR
          - MISSING_REQUIRED
          - NOT_FOUND
          - PERMISSION_DENIED
          - DUPLICATE
          - INTERNAL_ERROR
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                description: Campo com problema.
              message:
                type: string
                description: O que está errado.
              keyword:
                type: string
                description: Regra violada.
          description: Detalhes, em `VALIDATION_ERROR`.
        fields:
          type: array
          items:
            type: object
          description: Campos obrigatórios que faltaram, em `MISSING_REQUIRED`.
        details:
          type: object
          description: Detalhes adicionais, quando houver.
    CustomFieldValue:
      type: object
      required:
      - customField
      - v
      properties:
        customField:
          type: string
          pattern: ^[a-fA-F0-9]{24}$
          example: 507f1f77bcf86cd799439011
          description: ID do campo personalizado (de `GET /api/customfields`).
        k:
          type: string
          description: Chave (`slug`) do campo. Recomendado.
          example: segmento
        v:
          description: 'Valor do campo: texto, número, booleano, lista ou objeto. Envie em `v` — `value` é ignorado sem erro.'
          example: Tecnologia
    StaffSummary:
