    post:
      tags:
      - Workflows
      operationId: validateWorkflow
      summary: Validar o desenho do workflow
      description: 'Confere o rascunho gravado, ou o `draftGraph` enviado, e devolve os problemas por passo. Com `forPublish: true`, aplica também
        as exigências da publicação. Lista vazia em `issues` significa pronto para publicar.


        **Permissão do Service Account:** `workflows.edit`'
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: false
        content:
          application/json:
