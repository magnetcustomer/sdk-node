              $ref: '#/components/schemas/Ruleset'
        period:
          type: string
          enum:
          - DAY
          - WEEK
          - MONTH
          - TWO_MONTHS
          - QUARTER
          - SEMESTER
          - YEAR
          description: Agrupamento de datas no eixo X.
        axisX:
          description: 'Eixo X: o campo que separa os pontos do gráfico.'
          allOf:
          - type: object
            properties:
              resourceKeywordSlug:
                type: string
                description: '`slug` do campo (de `GET /api/resource-keywords`).'
                example: deal.stage_name
              aggregation:
                type: string
                enum:
                - GROUP
                - INTERVAL
                - SUM
                - AVG
                - MIN
                - MAX
                description: '`GROUP`: um ponto por valor do campo. `INTERVAL`: agrupa datas pelo `period`. `SUM`, `AVG`, `MIN`, `MAX`: calcula
                  sobre um campo numérico.'
              interval:
                type: number
                description: 'Tamanho do intervalo, em campos numéricos. Padrão: 0.'
              mask:
                type: string
                description: Máscara de exibição.
        axisY:
          description: 'Eixo Y: sem ele, o gráfico conta registros; com `aggregation: SUM` e um campo numérico, soma o campo em cada ponto.'
          allOf:
          - type: object
            properties:
              resourceKeywordSlug:
                type: string
                description: '`slug` do campo (de `GET /api/resource-keywords`).'
                example: deal.stage_name
              aggregation:
                type: string
                enum:
                - GROUP
                - INTERVAL
                - SUM
                - AVG
                - MIN
                - MAX
                description: '`GROUP`: um ponto por valor do campo. `INTERVAL`: agrupa datas pelo `period`. `SUM`, `AVG`, `MIN`, `MAX`: calcula
                  sobre um campo numérico.'
              interval:
                type: number
                description: 'Tamanho do intervalo, em campos numéricos. Padrão: 0.'
              mask:
                type: string
                description: Máscara de exibição.
        seriesBy:
          description: Separa o gráfico em séries, uma por valor do campo.
          allOf:
          - type: object
            properties:
              resourceKeywordSlug:
                type: string
                description: '`slug` do campo (de `GET /api/resource-keywords`).'
                example: deal.stage_name
              aggregation:
                type: string
                enum:
                - GROUP
                - INTERVAL
                - SUM
                - AVG
                - MIN
                - MAX
                description: '`GROUP`: um ponto por valor do campo. `INTERVAL`: agrupa datas pelo `period`. `SUM`, `AVG`, `MIN`, `MAX`: calcula
                  sobre um campo numérico.'
              interval:
                type: number
                description: 'Tamanho do intervalo, em campos numéricos. Padrão: 0.'
              mask:
                type: string
                description: Máscara de exibição.
        countBy:
          description: 'Em `NUMBER`: com `aggregation: SUM` e um campo numérico, o número é a soma do campo; sem ele, é a contagem de registros.'
          allOf:
          - type: object
            properties:
              resourceKeywordSlug:
                type: string
                description: '`slug` do campo (de `GET /api/resource-keywords`).'
                example: deal.stage_name
              aggregation:
                type: string
