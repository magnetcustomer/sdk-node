                  type: string
                  pattern: ^[a-fA-F0-9]{24}$
                  example: 507f1f77bcf86cd799439011
                  description: 'Opcional: ID da automação que está sendo editada.'
            example:
              automation:
                title: Alerta de contato sem interação
                sourceEntity: Contact
                triggerType: filter
                status: FREEZE
                triggerConfig:
                  type: scheduled
                  recurrence: daily
                  schedule:
                    time: 09:00
                    timezone: America/Sao_Paulo
                filter:
                  ruleset:
                    condition: AND
                    rules:
                    - fieldId: contact.lasttreatmentcreatedat
                      operator: older_than_days
                      value: 60
                automationActions:
                - actionType: notify
                  order: 1
                  config:
                    notifyConfig:
                      channel: push
                      recipients:
                      - owner
                      subject: Contato sem interação
                      content: '{contact.fullname} está há 60 dias sem interação.'
                limit: 50
      responses:
        '200':
          description: Sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  simulation:
                    type: object
                    properties:
                      status:
                        type: string
                        description: Situação da simulação.
                        example: complete
                      totalMatched:
                        type: integer
                        description: Quantos registros a automação alcançaria agora.
                      truncated:
                        type: boolean
                        description: A contagem foi interrompida no limite de segurança.
                      noFilter:
                        type: boolean
                        description: A automação não tem filtro.
                      filter:
                        type: object
                        properties:
                          conditionsCount:
                            type: integer
