    post:
      tags:
      - Formulários
      operationId: submitForm
      summary: Enviar uma resposta
      description: 'Registra uma resposta como se a pessoa tivesse preenchido o formulário. Use para trazer respostas coletadas em outro lugar.


        `payload` tem o formato de um contato: campos de sistema pelo nome (`fullname`, `email`, `doc`, `phones`) e campos personalizados em `customFields`,
        com `customField` e `v`. Com `settings.autoCreateContact` ligado, a resposta cria ou atualiza o contato; desligado, fica pendente.'
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - payload
              properties:
                payload:
                  type: object
                  description: Respostas.
                  properties:
                    fullname:
                      type: string
                      description: Nome completo.
                    email:
                      type: string
                      description: E-mail.
                    doc:
                      type: string
                      description: CPF ou CNPJ.
                    phones:
                      type: array
                      items:
                        type: object
                        properties:
                          number:
                            type: string
                            description: Número, só dígitos.
                            example: '11987654321'
                          ddi:
                            type: string
                            description: Código do país, com `+`.
                            example: '+55'
                          typePhone:
                            type: string
                            description: Tipo do telefone.
                            example: cellphone
                      description: Telefones.
                    customFields:
                      type: array
                      items:
                        $ref: '#/components/schemas/CustomFieldValue'
                      description: Respostas de campos personalizados.
            example:
              payload:
                fullname: Maria Santos
                email: maria@cliente.com
                phones:
                - number: '11987654321'
                  ddi: '+55'
                  typePhone: cellphone
      responses:
        '201':
          description: Resposta registrada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  submissionId:
                    type: string
                    description: Identificador da resposta.
                  createdInCrm:
                    type: boolean
                    description: Virou contato na hora.
                  crmContact:
                    type: string
                    nullable: true
                    description: ID do contato criado ou atualizado.
              example:
                submissionId: X2TOyH5DGw
                createdInCrm: true
                crmContact: 507f1f77bcf86cd799439012
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
