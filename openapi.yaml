    AutomationEventTrigger:
      type: object
      required:
      - event
      properties:
        event:
          type: string
          enum:
          - created
          - updated
          - deleted
          - status_changed
          - stage_changed
          - assigned
          - completed
          - reopened
          - won
          - lost
          - lifecycle_changed
          - submitted
          description: Evento que dispara a automação. Os eventos de cada recurso estão em `GET /api/processautomations/entities` (`supportedEvents`).
        fieldConditions:
          type: array
          items:
            type: object
            required:
            - field
            - operator
            properties:
              field:
                type: string
                description: Campo do registro, como vem em `availableFields` de `GET /api/processautomations/entities`.
                example: amount
              operator:
                type: string
                enum:
                - equals
                - not_equals
                - contains
                - not_contains
                - starts_with
                - ends_with
                - greater_than
                - less_than
                - greater_or_equal
                - less_or_equal
                - is_empty
                - is_not_empty
                - in
                - not_in
                - changed
                - not_changed
                - changed_to
                - changed_from
                description: Operador. Os de mudança (`changed`, `changed_to`...) comparam o valor antes e depois do evento.
              value:
                description: Valor comparado.
          description: Condições sobre os campos do registro. Todas precisam valer.
    AutomationAction:
      type: object
      required:
      - actionType
      properties:
        _id:
          type: string
          pattern: ^[a-fA-F0-9]{24}$
          example: 507f1f77bcf86cd799439011
        actionType:
          type: string
          enum:
          - create
          - update
          - notify
          - assign
          - webhook
          description: O que a ação faz.
        targetEntity:
          type: string
          enum:
          - Contact
          - Deal
          - Organization
          - Task
          - Meeting
          - Ticket
          - Email
          - SMS
          - WhatsApp
          - Push
          - Observation
          description: 'Em `create` e `update`: o recurso criado ou alterado.'
        order:
          type: integer
          description: Ordem de execução, a partir de 1.
        active:
          type: boolean
          description: 'Padrão: `true`.'
        condition:
          type: object
          description: Condição para a ação rodar.
          properties:
            enabled:
              type: boolean
            fieldConditions:
              type: array
              items:
                type: object
                required:
                - field
                - operator
                properties:
                  field:
                    type: string
                    description: Campo do registro, como vem em `availableFields` de `GET /api/processautomations/entities`.
                    example: amount
                  operator:
                    type: string
                    enum:
                    - equals
                    - not_equals
                    - contains
                    - not_contains
                    - starts_with
                    - ends_with
                    - greater_than
                    - less_than
                    - greater_or_equal
                    - less_or_equal
                    - is_empty
                    - is_not_empty
                    - in
                    - not_in
                    - changed
                    - not_changed
                    - changed_to
                    - changed_from
                    description: Operador. Os de mudança (`changed`, `changed_to`...) comparam o valor antes e depois do evento.
                  value:
                    description: Valor comparado.
        config:
          type: object
          description: Configuração da ação. Use a parte que corresponde ao `actionType`.
          properties:
            createFields:
              type: object
              description: 'Em `create`: campos do registro criado. Aceita variáveis entre chaves, como `{deal.title}`.'
              example:
                title: 'Follow-up: {deal.title}'
                taskTypeSlug: follow-up
                dueDateOffset: 1
                ownerSource: contact_owner
            updateFields:
              type: object
              description: 'Em `update`: campos alterados.'
            notifyConfig:
              type: object
              description: Em `notify`.
              properties:
                channel:
                  type: string
                  enum:
                  - email
                  - sms
                  - whatsapp
                  - push
                  - system
                  - slack
                  description: Canal.
                recipients:
                  type: array
                  items:
                    type: string
                    enum:
                    - owner
                    - creator
                    - assigned
                    - contact
                    - workspace
                    - workspace_fixed
                    - all_agents
                    - staff
                    - requester_and_ccs
                    - participants
                    - custom
                  description: Quem recebe.
                staffIds:
                  type: array
                  items:
                    type: string
                    pattern: ^[a-fA-F0-9]{24}$
                    example: 507f1f77bcf86cd799439011
                  description: 'Com `staff` em `recipients`: os usuários.'
                customRecipients:
                  type: array
                  items: {}
                  description: 'Com `custom` em `recipients`: os destinatários.'
                subject:
                  type: string
                  description: Assunto. Aceita variáveis.
                content:
                  type: string
                  description: Texto. Aceita variáveis, como `{contact.fullname}`.
            assignConfig:
              type: object
              description: Em `assign`.
              properties:
                assignType:
                  type: string
                  enum:
                  - specific
                  - round_robin
                  - least_busy
                  description: Como escolher o responsável.
                staffIds:
                  type: array
                  items:
                    type: string
                    pattern: ^[a-fA-F0-9]{24}$
                    example: 507f1f77bcf86cd799439011
                  description: Usuários candidatos.
                workspaceIds:
                  type: array
                  items:
                    type: string
                    pattern: ^[a-fA-F0-9]{24}$
                    example: 507f1f77bcf86cd799439011
                  description: Áreas de trabalho candidatas.
            webhookConfig:
              type: object
              description: 'Em `webhook`: chamada HTTP para o seu sistema.'
              properties:
                url:
                  type: string
                  description: Endereço chamado.
                method:
                  type: string
                  enum:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  default: POST
                headers:
                  type: object
                  description: Cabeçalhos.
                payload:
                  type: object
                  description: Corpo enviado. Aceita variáveis.
                retryOnFail:
                  type: boolean
                  default: true
                maxRetries:
                  type: integer
                  default: 3
