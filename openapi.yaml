    FormField:
      type: object
      description: Um campo do formulário.
      required:
      - id
      - componentType
      properties:
        id:
          type: string
          description: Identificador do campo dentro do formulário. Você escolhe; precisa ser único no formulário.
          example: field_0
        componentType:
          type: string
          enum:
          - customField
          - consent
          description: '`customField`: pergunta ligada a um campo do contato. `consent`: caixa de aceite.'
        customField:
          type: string
          pattern: ^[a-fA-F0-9]{24}$
          example: 507f1f77bcf86cd799439011
          description: 'Em `customField`: ID do campo do contato (de `GET /api/customfields?page=1&feature=contact`). Ao ler o formulário, vem
            o campo completo.'
        name:
          type: string
          description: Rótulo mostrado a quem preenche.
          example: Nome completo
        position:
          type: integer
          description: Ordem do campo, a partir de 0.
        gridPosition:
          type: object
          description: Onde o campo fica na grade.
          properties:
            rowId:
              type: string
              description: '`id` da linha.'
            columnId:
              type: string
              description: '`id` da coluna.'
            columnWidth:
              type: integer
              minimum: 1
              maximum: 12
        settings:
          type: object
          properties:
            required:
              type: boolean
              description: Resposta obrigatória.
            placeholder:
              type: string
              description: Texto de exemplo dentro do campo.
            helpText:
              type: string
              description: Texto de ajuda.
            defaultValue:
              description: Valor inicial.
            hidden:
              type: boolean
              description: Campo oculto, preenchido só pelo valor inicial.
            readonly:
              type: boolean
              description: Campo visível, mas não editável.
        validations:
          type: array
          items:
            type: object
            required:
            - type
            properties:
              type:
                type: string
                enum:
                - minLength
                - maxLength
                - pattern
                - email
                - phone
                - cpf
                - cnpj
                - date
                - number
                - url
                - custom
                description: Regra aplicada ao valor digitado.
              value:
                description: 'Parâmetro da regra: o tamanho em `minLength` e `maxLength`, a expressão em `pattern`.'
              message:
                type: string
                description: Mensagem mostrada quando a regra falha.
          description: Regras de validação do valor.
        conditionalRules:
          type: array
          items:
            type: object
            required:
            - action
            - conditions
            properties:
              action:
                type: string
                enum:
                - show
                - hide
                - require
                - disable
                description: O que acontece com o campo quando as condições valem.
              logic:
                type: string
                enum:
                - and
                - or
                default: and
                description: Como combinar as condições.
              conditions:
                type: array
                items:
                  type: object
                  required:
                  - fieldId
                  - operator
                  properties:
                    fieldId:
                      type: string
                      description: '`id` do campo observado, no mesmo formulário.'
                      example: field_0
                    operator:
                      type: string
                      enum:
                      - equals
                      - notEquals
                      - contains
                      - notContains
                      - isEmpty
                      - isNotEmpty
                      - greaterThan
                      - lessThan
                      - startsWith
                      - endsWith
                    value:
                      description: Valor comparado.
                description: Condições sobre outros campos do formulário.
          description: Regras que mostram, escondem, obrigam ou travam o campo conforme outras respostas.
    FormGrid:
      type: object
      description: 'Disposição dos campos: linhas com até 12 colunas de largura. Cada coluna leva um campo.'
      properties:
        rows:
          type: array
          items:
            type: object
            required:
            - id
            - columns
            properties:
              id:
                type: string
