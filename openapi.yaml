openapi: 3.0.3
info:
  title: API da Magnet Customer
  version: 2026-11
  description: "A API REST da Magnet Customer permite ler e gravar os registros do CRM a partir dos seus sistemas.\n\n# Comece aqui\n\n## 1. Crie\
    \ um Service Account\n\nNo CRM, abra **Configurações › Service Accounts** (apenas administradores), clique em **Novo service account**, escolha\
    \ a validade e as permissões, e copie o **Client ID** e o **Client Secret**. O secret aparece uma única vez.\n\n## 2. Solicite um token\n\n\
    ```bash\ncurl -X POST https://magnetcustomer.net/realms/platform/protocol/openid-connect/token \\\n  -H \"Content-Type: application/x-www-form-urlencoded\"\
    \ \\\n  -d \"grant_type=client_credentials\" \\\n  -d \"client_id=SEU_CLIENT_ID\" \\\n  -d \"client_secret=SEU_CLIENT_SECRET\"\n```\n\n```json\n\
    { \"access_token\": \"eyJhbGciOiJSUzI1NiIs...\", \"expires_in\": 900, \"token_type\": \"Bearer\" }\n```\n\nO token vale 15 minutos e este\
    \ fluxo não tem refresh token: quando vencer, ou ao receber `401`, repita o pedido.\n\n## 3. Chame a API\n\nCada conta tem o seu endereço.\
    \ Troque `sua-conta` pelo subdomínio que você usa para abrir o CRM:\n\n```bash\ncurl \"https://sua-conta.platform-api.magnetcustomer.com/api/deals?page=1&limit=15\"\
    \ \\\n  -H \"Authorization: Bearer SEU_TOKEN\"\n```\n\nRequisições com corpo levam também `Content-Type: application/json`.\n\n# Convenções\n\
    \n## Paginação\n\nEnvie sempre `page`. Com ele, toda listagem devolve o mesmo envelope:\n\n```json\n{ \"docs\": [], \"total\": 132, \"pages\"\
    : 9, \"page\": 1, \"limit\": 15 }\n```\n\n| Parâmetro | Padrão | Descrição |\n|---|---|---|\n| `page` | — | Página, a partir de 1. **Obrigatório\
    \ na prática** |\n| `limit` | 15 | Registros por página. Máximo 100: acima disso a API usa 100 |\n| `sortBy` | varia por recurso | Campo de\
    \ ordenação |\n| `sortType` | `desc` | `asc` ou `desc` |\n| `search` | — | Busca textual, quando o recurso aceita |\n\nSem `page`, algumas\
    \ listagens (Contatos, Pipelines, Campos personalizados e os cadastros de apoio, como tipos e situações) devolvem uma lista simples (`[...]`),\
    \ sem o envelope, e ignoram `limit`. Para percorrer tudo, peça `page=1` e avance até `page` ser igual a `pages`. Uma página além do fim devolve\
    \ `docs` vazio.\n\nO tamanho de página padrão é 15, com duas exceções: 25 em Leads, Prospects e Clientes, e 100 em Usuários. Um `limit` inválido\
    \ cai no padrão.\n\n## Identificadores e datas\n\nTodo ID é um texto de 24 caracteres hexadecimais, como `507f1f77bcf86cd799439011`. Ao gravar,\
    \ envie a referência como **ID em texto** — nunca o objeto.\n\nNo corpo e nas respostas, datas são ISO 8601 em UTC, como `2026-05-15T10:00:00Z`.\
    \ Nos filtros de data da URL (`minDate`, `createdAt_minDate`, `dateOfExpires_minDate`...), envie um **timestamp em milissegundos**, como `1798761600000`.\n\
    \n## Listas na URL\n\nFiltros que aceitam vários valores levam colchetes no nome:\n\n```\n/api/contacts?page=1&staffs[]=507f191e810c19729de860eb&staffs[]=507f191e810c19729de860ec\n\
    ```\n\nUm valor único sem colchetes (`staffs=id`) ou separado por vírgula (`staffs=id1,id2`) também é aceito.\n\n## Campos ausentes\n\nCampo\
    \ sem valor costuma vir **ausente** da resposta, não como `null`. Trate a falta da chave como vazio.\n\n## Campos personalizados\n\nOs campos\
    \ criados pelo administrador da conta vão na lista `customFields`:\n\n```json\n{ \"customFields\": [ { \"customField\": \"507f1f77bcf86cd799439014\"\
    , \"k\": \"segmento\", \"v\": \"Tecnologia\" } ] }\n```\n\nO valor vai em **`v`**. Um item com `value` é aceito sem erro, mas o campo fica\
    \ vazio. Descubra os campos e os IDs com `GET /api/customfields?page=1&feature=deal` (troque `deal` por `meeting`, `task`, `contact`...).\
    \ Com `&required=true` vêm só os obrigatórios da conta.\n\n## Erros\n\n```json\n{\n  \"reason\": \"Missing required parameters\",\n  \"message\"\
    : \"Missing required parameters\",\n  \"code\": \"VALIDATION_ERROR\",\n  \"errors\": [ { \"field\": \"title\", \"message\": \"must NOT have\
    \ fewer than 1 characters\", \"keyword\": \"minLength\" } ]\n}\n```\n\n| Status | Quando |\n|---|---|\n| `400` | Corpo ou parâmetro inválido:\
    \ campo obrigatório ausente, tipo errado, valor fora da lista, ID fora do formato |\n| `401` | Token ausente, inválido ou vencido. Corpo:\
    \ `{\"reason\": \"Access Denied\"}` |\n| `403` | O Service Account não tem a permissão da rota (`type: SA_PERMISSION_DENIED`, com `requiredPermission`)\
    \ |\n| `404` | Registro não encontrado |\n| `409` | O registro não está no estado que a operação exige |\n| `429` | Limite de requisições\
    \ excedido. Espere o tempo de `Retry-After` |\n\n## Permissões\n\nUm Service Account só chama as rotas que as permissões dele liberam. Cada\
    \ operação desta referência informa a permissão exigida, quando há uma: marque-a ao criar o Service Account. Uma chamada sem a permissão devolve\
    \ `403` com o nome dela em `requiredPermission`.\n\nRotas de administração da conta (usuários, perfis, criação de webhooks, configurações)\
    \ exigem um usuário administrador e não estão disponíveis para Service Accounts; por isso não aparecem aqui.\n\n## Limite de requisições\n\
    \nOs limites são aplicados por conta. Ao receber `429`, espere os segundos indicados em `Retry-After` e tente de novo com intervalo crescente.\n\
    \n## Área de trabalho\n\nEm contas com áreas de trabalho, a API define a área do registro pela credencial ou pelo registro pai. Não envie\
    \ `workspace`.\n\n# Regras de filtro\n\nDashboards, widgets, predefinições de filtro, automações, workflows e campanhas usam o mesmo formato\
    \ para dizer quais registros entram: o **conjunto de regras** (`ruleset`).\n\n```json\n{\n  \"condition\": \"AND\",\n  \"rules\": [\n    {\
    \ \"fieldId\": \"deal.amount\", \"operator\": \"greater\", \"value\": 1000 },\n    {\n      \"condition\": \"OR\",\n      \"rules\": [\n \
    \       { \"fieldId\": \"deal.won\", \"operator\": \"false_value\" },\n        { \"fieldId\": \"deal.stage_name\", \"operator\": \"contains\"\
    , \"value\": \"Proposta\" }\n      ]\n    }\n  ]\n}\n```\n\n- **`condition`**: `AND` exige todas as regras; `OR`, pelo menos uma.\n- **`rules`**:\
    \ cada item é uma condição (`fieldId`, `operator`, `value`) ou um grupo aninhado (`condition`, `rules`).\n- **`fieldId`**: o `slug` de um\
    \ campo. A lista de campos da conta, com os personalizados, vem de `GET /api/resource-keywords`; filtre por recurso com `?modelRef=deal`.\n\
    - **`operator`**: escolha pelo tipo do campo (`type`, na lista de campos).\n\n| Tipo do campo | Operadores |\n|---|---|\n| Texto (`string`)\
    \ | `equals`, `not_equal`, `contains`, `not_contains`, `starts_with`, `ends_with`, `exists`, `not_exists` |\n| Número e valor (`number`, `monetary`,\
    \ `days`) | `equals`, `not_equal`, `greater`, `greater_or_equals`, `less`, `less_or_equals`, `between` (com `valueMin` e `valueMax`) |\n|\
    \ Sim ou não (`boolean`) | `true_value`, `false_value` |\n| Lista (`select`) | `in`, `not_in`, com `value` em lista |\n| Data (`date`) | `current_day`,\
    \ `current_week`, `current_month`, `current_year`, `before_day`, `before_week`, `before_month`, `before_year`, `last_n_days`, `next_n_days`,\
    \ `before_date`, `after_date`, `date_between` |\n\nAs regras de um widget não são validadas na gravação: um campo ou operador que não existe\
    \ é aceito, e o resultado vem vazio. Confira os nomes antes de enviar.\n\n# Workflows\n\nUm workflow é um desenho de **passos** (`nodes`)\
    \ ligados por **saídas** (`edges`). O contato entra por um gatilho e segue as ligações até um passo `end`. Todo caminho precisa terminar num\
    \ `end`.\n\n```json\n{\n  \"nodes\": [\n    { \"id\": \"n1\", \"type\": \"manual_trigger\", \"config\": {} },\n    { \"id\": \"n2\", \"type\"\
    : \"wait\", \"config\": { \"amount\": 2, \"unit\": \"days\" } },\n    { \"id\": \"n3\", \"type\": \"end\", \"config\": {} }\n  ],\n  \"edges\"\
    : [\n    { \"id\": \"e1\", \"from\": \"n1\", \"port\": \"default\", \"to\": \"n2\" },\n    { \"id\": \"e2\", \"from\": \"n2\", \"port\": \"\
    default\", \"to\": \"n3\" }\n  ]\n}\n```\n\nO ciclo é: criar (`POST /api/workflows`), desenhar (`PATCH`, com `draftGraph`), conferir (`POST\
    \ .../validate` com `forPublish: true`) e publicar (`POST .../publish`). Só depois de publicado o workflow age sobre contatos.\n\n## Gatilhos\n\
    \n| `type` | Quando o contato entra | `config` |\n|---|---|---|\n| `manual_trigger` | Quando alguém, ou a API, inscreve o contato (`POST /api/workflows/{id}/enrollments`)\
    \ | vazio |\n| `segment_trigger` | Na agenda, para os contatos que casam com o filtro | `schedule` (obrigatório): `mode` (`daily`, `weekly`,\
    \ `monthly`), `hour` (0–23), `minute`, `weekday` (0–6, em `weekly`), `day` (1–28, em `monthly`). `ruleset`: quem entra. `exclude`: quem não\
    \ entra, no mesmo formato |\n| `form_trigger` | Quando o contato responde um formulário | `formId` (obrigatório) |\n| `crm_event_trigger`\
    \ | Quando um evento do CRM acontece | `event` (obrigatório): `contact.created`, `deal.created`, `deal.stage_changed`, `deal.won`, `deal.lost`,\
    \ `meeting.created`, `journey.created`, `journey.phase_entered`, `journey.closed`. `filter`: `pipelineId`, `stageId` (eventos de oportunidade);\
    \ `journeyFlowId`, `phaseId`, `closeStatus`, `churnReasonId` (eventos de jornada). `ruleset`: filtro sobre o contato |\n\n## Passos\n\n| `type`\
    \ | O que faz | Saídas (`port`) | `config` |\n|---|---|---|---|\n| `wait` | Espera um tempo | `default` | `amount` (1–999) e `unit` (`minutes`,\
    \ `hours`, `days`, `weeks`), obrigatórios. `businessDaysOnly` |\n| `if_else` | Separa em dois caminhos | `yes`, `no` | `ruleset` (obrigatório)\
    \ |\n| `split` | Separa em vários caminhos; o contato segue o primeiro que casar | o `id` de cada caminho, e `none` | `branches` (2 a 12):\
    \ `id`, `label` e `ruleset` de cada caminho |\n| `send_email` | Envia um e-mail | `default` | `designTemplateId` e `subject`, obrigatórios.\
    \ `preheader`, `links` (`linkId`, `name`), `utm` (`enabled`, `campaign`), `respectContactLimit` |\n| `wait_reaction` | Espera uma reação a\
    \ um e-mail anterior | o `id` de cada reação, e `timeout` | `reactionTo` (o `id` do passo de e-mail), `branches` (1 a 8: `id`, `label`, `kind`\
    \ — `opened`, `clicked_any`, `clicked_link` com `linkId`, ou `crm_event` com `event`) e `timeout` (`amount`, `unit` em `hours`, `days` ou\
    \ `weeks`), todos obrigatórios |\n| `create_task` | Cria uma tarefa | `default` | `taskTypeSlug`, `title`, `due` (`mode`: `days_after` com\
    \ `days`, ou `end_of_cycle_month`) e `assignee` (`mode`: `contact_owner`, `staff` com `staffId`, ou `journey_staff`), obrigatórios. `observation`,\
    \ `estimatedMinutes` |\n| `create_deal` | Cria uma oportunidade | `default` | `pipelineId`, `stageId`, `title` e `assignee` (`mode`: `contact_owner`,\
    \ ou `staff` com `staffId`), obrigatórios. `value`, `expectedClose` (`days`) |\n| `update_contact` | Altera campos do contato | `default`\
    \ | `fields` (obrigatório): lista de `fieldId` e `value` |\n| `end` | Termina o caminho | nenhuma | vazio |\n\nAs condições (`ruleset`) seguem\
    \ o formato de \"Regras de filtro\".\n\n# Webhooks\n\nPara ser avisado quando algo muda no CRM, em vez de consultar a API de tempos em tempos,\
    \ use webhooks. Um administrador cria o webhook no CRM, em **Integrações › Webhooks**, informando a URL do seu sistema e os eventos. A lista\
    \ de eventos está em `GET /api/webhooks/triggers`; o formato da entrega, a assinatura e os reenvios estão na seção Webhooks do portal.\n\n\
    # Cobertura\n\nEsta referência cobre Contatos (leads, prospects e clientes), Empresas, Oportunidades, Pipelines, etapas e motivos de perda,\
    \ Produtos, tabelas de preço e itens de produto, Jornadas, Reuniões, Tarefas, Observações, Tickets, Atendimentos, Usuários, Equipes, Áreas\
    \ de trabalho, Campos personalizados, Dashboards (com widgets, filtros e resultados), Automações de processo, Workflows, Campanhas, Produtos\
    \ financeiros, Formulários (com respostas), a assistente de IA e os eventos de webhook.\n"
  contact:
    name: Suporte Magnet Customer
    email: suporte@magnetcustomer.com
servers:
- url: https://{conta}.platform-api.magnetcustomer.com
  description: API da sua conta
  variables:
    conta:
      default: sua-conta
      description: Subdomínio da sua conta — o mesmo que você usa para abrir o CRM.
security:
- ServiceAccount: []
tags:
- name: Contatos
  description: 'Pessoas em qualquer fase: lead, prospect ou cliente.'
- name: Leads
  description: Contatos na fase `lead`. Mesmos campos de Contatos.
- name: Prospects
  description: Contatos na fase `prospect`. Mesmos campos de Contatos.
- name: Clientes
  description: Contatos na fase `customer`. Mesmos campos de Contatos.
- name: Empresas
  description: Organizações às quais os contatos pertencem.
- name: Oportunidades
  description: 'Negócios em andamento: pipeline, etapa, responsável, valor e fechamento.'
- name: Pipelines e etapas
  description: Consulta dos pipelines, das etapas e dos motivos de perda, para criar, mover e fechar oportunidades.
- name: Produtos
  description: Catálogo de produtos e serviços da conta.
- name: Tabelas de preço
  description: 'Preços por tabela: a padrão e as específicas, como parceiros ou regiões.'
- name: Itens de produto
  description: Produtos vinculados a oportunidades, contatos e empresas, com quantidade, preço e desconto.
- name: Jornadas
  description: 'Acompanhamento do cliente depois da venda: fase, contrato, renovação e health score. Somente leitura.'
- name: Reuniões
  description: Compromissos com contato, empresa ou oportunidade.
- name: Tarefas
  description: Atividades com responsável, tipo e vencimento.
- name: Tipos de tarefa
  description: Cadastro dos tipos usados no campo `type` das tarefas.
- name: Observações
  description: Anotações em contatos, empresas, oportunidades e produtos, com menção a usuários.
- name: Tickets
  description: 'Pedidos de suporte: abertura, situação, responsável e mensagens.'
- name: Atendimentos
  description: 'Registro de cada contato feito com o cliente: ligação, visita, e-mail.'
- name: Usuários
  description: Consulta dos usuários da conta, para preencher responsáveis e participantes.
- name: Campos personalizados
  description: 'Consulta dos campos da conta: IDs, chaves e quais são obrigatórios.'
- name: Equipes e áreas de trabalho
  description: Consulta das equipes e das áreas de trabalho da conta.
- name: Formulários
  description: 'Formulários de captação: campos, validações, regras condicionais e respostas. A publicação, que gera o endereço público, é feita
    na tela do CRM.'
- name: Produtos financeiros
  description: 'Posições dos contatos em produtos financeiros: ações, renda fixa, fundos, previdência e outros. Disponível nas contas com o módulo
    de produtos financeiros ligado.'
- name: Assistente de IA
  description: 'Conversas com a Mag, a assistente de IA do CRM: envie pedidos em linguagem natural e receba a resposta em fluxo. Disponível nas
    contas com a assistente ligada; cada resposta consome créditos de IA. As consultas e ações da Mag são feitas em nome do Service Account e
    passam pelas permissões dele.'
- name: Campanhas
  description: 'Envios em massa por e-mail: público, conteúdo, agendamento, verificação antes do envio e resultados.'
- name: Workflows
  description: 'Sequências de passos por contato: gatilho, esperas, condições, e-mails e ações no CRM. Disponível nas contas com o módulo de workflows
    ligado.'
- name: Automações
  description: 'Automações de processo: o que dispara, quais registros entram e quais ações são executadas.'
- name: Dashboards
  description: 'Painéis de indicadores: dashboards, widgets, filtros e resultados.'
- name: Campos para filtros
  description: Catálogo dos campos que podem entrar em regras de filtro, eixos e colunas.
- name: Webhooks
  description: Eventos que o CRM envia para o seu sistema. A assinatura é configurada no CRM; aqui você consulta os eventos disponíveis.
x-tagGroups:
- name: Cadastros
  tags:
  - Contatos
  - Leads
  - Prospects
  - Clientes
  - Empresas
- name: Vendas
  tags:
  - Oportunidades
  - Pipelines e etapas
  - Jornadas
- name: Catálogo
  tags:
  - Produtos
  - Tabelas de preço
  - Itens de produto
- name: Financeiro
  tags:
  - Produtos financeiros
- name: Inteligência artificial
  tags:
  - Assistente de IA
- name: Atividades
  tags:
  - Reuniões
  - Tarefas
  - Tipos de tarefa
  - Observações
- name: Suporte
  tags:
  - Tickets
  - Atendimentos
- name: Configuração da conta
  tags:
  - Usuários
  - Campos personalizados
  - Equipes e áreas de trabalho
- name: Captação
  tags:
  - Formulários
- name: Automação
  tags:
  - Campanhas
  - Workflows
  - Automações
- name: Indicadores
  tags:
  - Dashboards
  - Campos para filtros
- name: Eventos
  tags:
  - Webhooks
paths:
  /api/deals:
    get:
      tags:
      - Oportunidades
      operationId: listDeals
      summary: Listar oportunidades
      description: 'Ordenação padrão: `createdAt` decrescente.


        **Permissão do Service Account:** `deals.list`'
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/SortBy'
      - $ref: '#/components/parameters/SortType'
      - name: pipeline
        in: query
        description: ID do pipeline.
        schema:
          type: string
      - name: stage
        in: query
        description: ID da etapa.
        schema:
          type: string
      - name: contact
        in: query
        description: ID do contato.
        schema:
          type: string
      - name: organization
        in: query
        description: ID da empresa.
        schema:
          type: string
      - name: staffs[]
        in: query
        description: 'Usuários: busca em responsável, participantes e observadores. Lista de IDs (`?staffs[]=id1&staffs[]=id2`).'
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
      - name: contacts[]
        in: query
        description: Vários contatos. Lista de IDs (`?contacts[]=id1&contacts[]=id2`).
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
      - name: minDate
        in: query
        description: Fechamento previsto (`expectedCloseDate`) a partir de. Timestamp em milissegundos, não data ISO.
        schema:
          type: integer
          example: 1798761600000
      - name: maxDate
        in: query
        description: Fechamento previsto até. Timestamp em milissegundos.
        schema:
          type: integer
      - name: search
        in: query
        description: Busca em título, nome e e-mail do contato.
        schema:
          type: string
      responses:
        '200':
          description: Sucesso.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Page'
                - type: object
                  properties:
                    docs:
                      type: array
                      items:
                        $ref: '#/components/schemas/Deal'
              example:
                docs:
                - _id: 507f1f77bcf86cd799439015
                  code: 39
                  title: Implantação CRM Enterprise
                  amount: 75000
                  expectedCloseDate: '2026-06-30T23:59:59Z'
                  won: false
                  lost: false
                  closed: false
                  closedDate: null
                  enteredStageDate: '2026-04-28T10:30:00Z'
                  source: platform
                  active: true
                  pipeline: 507f1f77bcf86cd799439011
                  stage:
                    _id: 507f191e810c19729de860ea
                    name: Prospecção
                    position: 0
                    won: false
                    lost: false
                  staff:
                    _id: 507f191e810c19729de860eb
                    fullname: João Silva
                    email: joao@acme.com
                  contact:
                    _id: 507f1f77bcf86cd799439012
                    fullname: Maria Santos
                    lifeCycle: customer
                    owners:
                    - 507f191e810c19729de860eb
                  participants: []
                  observers: []
                  labels: []
                  customFields:
                  - customField: 507f1f77bcf86cd799439014
                    k: segmento
                    v: Tecnologia
                  createdAt: '2026-04-28T10:30:00Z'
                  updatedAt: '2026-04-28T10:30:00Z'
                total: 132
                pages: 9
                page: 1
                limit: 15
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags:
      - Oportunidades
      operationId: createDeal
      summary: Criar oportunidade
      description: 'Se `staff` não for enviado, a API usa o usuário da credencial.


        A criação é idempotente por 5 minutos: reenviar o mesmo corpo não duplica o registro. Para controlar a chave, envie o cabeçalho `Idempotency-Key`.


        **Permissão do Service Account:** `deals.create`'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DealCreate'
            example:
              title: Implantação CRM Enterprise
              pipeline: 507f1f77bcf86cd799439011
              stage: 507f191e810c19729de860ea
              staff: 507f191e810c19729de860eb
              amount: 75000
              contact: 507f1f77bcf86cd799439012
              expectedCloseDate: '2026-06-30T23:59:59Z'
              customFields:
              - customField: 507f1f77bcf86cd799439014
                k: segmento
                v: Tecnologia
      responses:
        '201':
          description: Oportunidade criada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deal'
              example:
                _id: 507f1f77bcf86cd799439015
                code: 39
                title: Implantação CRM Enterprise
                amount: 75000
                expectedCloseDate: '2026-06-30T23:59:59Z'
                won: false
                lost: false
                closed: false
                closedDate: null
                enteredStageDate: '2026-04-28T10:30:00Z'
                source: platform
                active: true
