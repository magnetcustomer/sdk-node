    AiChat:
      type: object
      description: Conversa com a Mag, a assistente de IA.
      properties:
        _id:
          type: string
          pattern: ^[a-fA-F0-9]{24}$
          example: 507f1f77bcf86cd799439011
        title:
          type: string
          description: Título.
          example: Oportunidades paradas
        channel:
          type: string
          description: Canal da conversa.
          example: web
        messageCount:
          type: integer
          description: Quantidade de mensagens.
        lastMessagePreview:
          type: string
          description: Trecho da última mensagem.
        pendingConfirmation:
          type: boolean
          description: A Mag está esperando a confirmação de uma ação.
        rating:
          type: integer
          nullable: true
          description: Nota dada à conversa, de 1 a 5.
        archived:
          type: boolean
        staff:
          type: string
          pattern: ^[a-fA-F0-9]{24}$
          example: 507f1f77bcf86cd799439011
          description: Usuário dono da conversa.
        lastMessageAt:
          type: string
          format: date-time
          description: Última mensagem.
          example: '2026-05-15T14:00:00Z'
        createdAt:
          type: string
          format: date-time
          description: Criação.
          example: '2026-05-15T14:00:00Z'
        updatedAt:
          type: string
          format: date-time
          description: Última alteração.
          example: '2026-05-15T14:00:00Z'
    AiChatMessage:
      type: object
      properties:
        _id:
          type: string
          pattern: ^[a-fA-F0-9]{24}$
          example: 507f1f77bcf86cd799439011
        chat:
          type: string
          pattern: ^[a-fA-F0-9]{24}$
          example: 507f1f77bcf86cd799439011
          description: Conversa.
        role:
          type: string
          enum:
          - user
          - assistant
          description: '`user`: a pergunta. `assistant`: a resposta da Mag.'
        content:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                description: Tipo do trecho.
                example: text
              text:
                type: string
                description: Texto.
          description: Conteúdo, em trechos.
        status:
          type: string
          description: 'Estado da mensagem: `completed` ou `awaiting_confirmation`.'
          example: completed
        costCents:
          type: integer
          description: Créditos consumidos pela resposta.
        toolCalls:
          type: integer
          description: Quantas consultas ou ações a Mag fez.
        createdAt:
          type: string
          format: date-time
          description: Criação.
          example: '2026-05-15T14:00:00Z'
