              type: object
              additionalProperties: false
              properties:
                draftGraph:
                  $ref: '#/components/schemas/WorkflowGraph'
                settings:
                  $ref: '#/components/schemas/WorkflowSettings'
                forPublish:
                  type: boolean
                  description: Aplica as exigências da publicação.
            example:
              forPublish: true
      responses:
        '200':
          description: Sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  issues:
                    type: array
                    items:
                      type: object
                      properties:
                        nodeId:
                          type: string
                          description: Passo com problema.
                        code:
                          type: string
                          description: Tipo do problema.
                          example: missing_end
                        message:
                          type: string
                          description: Explicação, em português.
                    description: Problemas que impedem a publicação.
                  warnings:
                    type: array
                    items:
                      type: object
                    description: Avisos que não impedem a publicação.
              example:
                issues:
                - nodeId: n4
                  code: missing_end
                  message: O caminho depois do passo "Criar tarefa" precisa terminar num Fim.
