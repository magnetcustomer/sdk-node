  /api/ai/chats/{chatId}/messages:
    post:
      tags:
      - Assistente de IA
      operationId: sendAiMessage
      summary: Enviar mensagem à Mag
      description: 'Envia um pedido em linguagem natural. A Mag consulta e altera o CRM em nome do Service Account que fez a chamada, e cada resposta
        consome créditos de IA da conta.


        A resposta chega em fluxo (`text/event-stream`), um evento por bloco:


        | Evento | Quando | Dados |

        |---|---|---|

        | `text` | A cada trecho da resposta | `text` |

        | `tool` | Quando a Mag consulta ou altera algo no CRM | a consulta ou ação em andamento |

        | `confirmation` | Quando uma ação precisa de confirmação antes de ser executada | `messageId`, `message`, `preview`, `pendingToolCalls`
        |

        | `done` | No fim do turno | `messageId`, `userMessageId`, `status` (`completed` ou `awaiting_confirmation`), `costCents`, `balanceCredits`
        |

        | `title` | Depois do `done`, quando a conversa ganha um título | o título |

        | `error` | Em caso de falha | `reason`, `status` (`402`: créditos insuficientes) |


        O status HTTP é `200` mesmo quando o turno falha: confira o evento `error`.'
      parameters:
      - name: chatId
        in: path
        required: true
        description: ID da conversa.
        schema:
          type: string
          pattern: ^[a-fA-F0-9]{24}$
          example: 507f1f77bcf86cd799439011
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - text
              properties:
                text:
                  type: string
                  description: O pedido.
            example:
              text: Liste as oportunidades paradas há mais de 15 dias.
      responses:
        '200':
          description: Fluxo de eventos.
          content:
            text/event-stream:
              schema:
                type: string
              example: 'event: text

                data: {"text":"Encontrei 3 oportunidades sem interação há mais de 15 dias."}


                event: done

                data: {"messageId":"507f1f77bcf86cd799439282","userMessageId":"507f1f77bcf86cd799439281","lastMessagePreview":"Encontrei 3 oportunidades
                sem interação há mais de 15 dias.","status":"completed","costCents":45,"balanceCredits":10245,"creditSource":"account"}


                '
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/ai/chats/{chatId}/messages/{messageId}/confirm:
    post:
      tags:
      - Assistente de IA
      operationId: confirmAiMessage
      summary: Confirmar ou recusar uma ação da Mag
      description: 'Responde a um evento `confirmation`. Com `approved: true`, a Mag executa a ação e continua; com `false`, desiste dela. Quando
        há mais de uma ação pendente, `approvedIds` escolhe quais executar. A resposta chega em fluxo, com os mesmos eventos do envio de mensagem.'
      parameters:
      - name: chatId
        in: path
        required: true
        description: ID da conversa.
        schema:
          type: string
          pattern: ^[a-fA-F0-9]{24}$
          example: 507f1f77bcf86cd799439011
      - name: messageId
        in: path
        required: true
        description: ID da mensagem que pediu a confirmação (`messageId` do evento `confirmation`).
        schema:
          type: string
          pattern: ^[a-fA-F0-9]{24}$
          example: 507f1f77bcf86cd799439011
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - approved
              properties:
                approved:
                  type: boolean
                  description: '`true` executa; `false` recusa.'
                approvedIds:
                  type: array
                  items:
                    type: string
                  description: Ações aprovadas, pelos `id` de `pendingToolCalls`. Sem o campo, `approved` vale para todas.
            example:
              approved: true
      responses:
        '200':
          description: Fluxo de eventos.
          content:
            text/event-stream:
              schema:
                type: string
              example: 'event: text

                data: {"text":"Encontrei 3 oportunidades sem interação há mais de 15 dias."}


                event: done

                data: {"messageId":"507f1f77bcf86cd799439282","userMessageId":"507f1f77bcf86cd799439281","lastMessagePreview":"Encontrei 3 oportunidades
                sem interação há mais de 15 dias.","status":"completed","costCents":45,"balanceCredits":10245,"creditSource":"account"}


                '
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/ai/chats/{chatId}/rating:
    post:
      tags:
      - Assistente de IA
      operationId: rateAiChat
      summary: Avaliar conversa com a Mag
      parameters:
      - name: chatId
        in: path
        required: true
        description: ID da conversa.
        schema:
          type: string
          pattern: ^[a-fA-F0-9]{24}$
          example: 507f1f77bcf86cd799439011
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - rating
