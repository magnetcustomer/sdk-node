                summary:
                  totalPatrimonio: 15230.5
                  positionDate: '2026-05-10T00:00:00Z'
                  totalProducts: 1
                  byType:
                  - type: financialProductEquities
                    total: 15230.5
                    count: 1
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
