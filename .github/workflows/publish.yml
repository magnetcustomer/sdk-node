name: Publish

# Publica no npm quando uma release é publicada no GitHub.
# Não usa token: o npm confia neste workflow (Trusted Publisher) e emite a procedência do pacote.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing exige npm 11.5.1 ou superior.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm test
      - name: Confere se a tag é a versão do pacote
        run: test "v$(node -p "require('./package.json').version")" = "${{ github.event.release.tag_name }}"
      - run: npm publish --access public
